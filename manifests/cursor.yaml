id: cursor
name: Cursor CLI (cursor-agent)
vendor: Anysphere
description: >
  Braço de terminal do Cursor. Modo print (`-p`) com saída estruturada,
  compartilhando a mesma conta e histórico do editor.

bin: cursor-agent

detect:
  args: ["--version"]
  versionRegex: "(\\d+\\.\\d+\\.\\d+)"

invoke:
  oneShot: ["-p", "--output-format", "stream-json"]
  resume: ["--resume", "{{nativeSessionId}}", "-p", "--output-format", "stream-json"]
  stdinPrompt: true
  interactive: false
  extraArgs: []
  env: {}

# NÃO VERIFICADO: o `cursor-agent` não está instalado nesta máquina, então não
# há `--help` para conferir a flag de modelo. Declarado sem suporte para o
# painel não oferecer um controle que ninguém sabe se funciona.
model:
  supported: false

verified:
  status: unverified
  version: null
  date: "2026-09-26"
  notes: "binario `cursor-agent` ausente nesta maquina (where cursor-agent: nao encontrado); flags deduzidas da documentacao publica, nunca conferidas"

session:
  strategy: native

stream:
  format: jsonl
  # O envelope do Cursor difere do Claude; o mapper genérico já entrega
  # timeline utilizável até escrevermos um dedicado na fase 2.
  mapper: generic-json

capabilities:
  - code-edit
  - refactor
  - debug
  - shell

auth:
  mode: inherit
  loginHint: "rode `cursor-agent login`"

defaults:
  isolation: worktree
  timeoutSeconds: 1800
  supervision: semi

caveats:
  - "NAO VERIFICADO: as flags aqui sao deduzidas da documentacao, nao confirmadas contra o binario. Em 2026-09-26 o `cursor-agent` continua NAO instalado nesta maquina; nada deste manifesto foi exercitado."
  - "Sem modeArgs: supervised, semi e autonomous rodam IGUAIS no Cursor (nenhuma restricao nativa foi conferida). A unica protecao em supervised e a do proprio Hub."
  - "Selecao de modelo desligada (`model.supported: false`) ate a flag ser conferida no `cursor-agent --help`."
  - "A IDE do Cursor estar instalada NAO basta: o agente de terminal e um binario separado (`cursor-agent`), e nesta maquina so existem `cursor` e os tuneis. Instale a CLI do Cursor para este manifesto valer."
  - "Mapper generico: extrai `session_id`, texto de `message.content[]` e `usage` quando o stream os traz (formato estilo Claude, SUPOSTO — binario ausente nesta maquina); eventos de ferramenta do Cursor ainda nao sao reconhecidos."
  - "session.strategy: native depende de o stream-json do Cursor trazer `session_id` (como o do Claude); sem ele, todo turno cai em replay. Nao verificado contra o binario."
