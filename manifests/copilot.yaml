id: copilot
name: GitHub Copilot CLI
vendor: GitHub / Microsoft
description: >
  Agente de terminal do Copilot, com controle fino de ferramentas por flag e
  saída estruturada em JSONL. Escolhe o modelo sozinho em modo auto.

bin: copilot

detect:
  args: ["--version"]
  versionRegex: "(\\d+\\.\\d+\\.\\d+)"

invoke:
  # Verificado contra o binário 1.0.70 (flags reconferidas no --help 1.0.88): `-p` recebe o TEXTO do prompt como
  # valor, não caminho de arquivo, e `--output-format json` emite JSONL — um
  # objeto por linha.
  #
  # O prompt vai em argv porque o `--help` (1.0.88) só documenta stdin
  # combinado com `--fleet`. Isso é seguro porque o Hub desembrulha o shim
  # `copilot.cmd` do npm e spawna `node npm-loader.js` direto, sem `cmd.exe`
  # (`resolverShimNpm` em bin-resolver.ts): antes, o prompt passava pelo
  # `cmd.exe` — injeção de comando, Brief multilinha cortado na 1ª linha,
  # teto de 8 KB e CJK/emoji virando `?`.
  oneShot: ["-p", "{{prompt}}", "--output-format", "json", "--no-color"]
  resume: ["-p", "{{prompt}}", "--resume", "{{nativeSessionId}}", "--output-format", "json", "--no-color"]
  stdinPrompt: false
  interactive: false
  # DELIBERADAMENTE sem `--allow-all-tools` fixo aqui: essa flag dá ao agente o
  # mesmo poder que você tem na máquina, sem revisão. Ela entra só via
  # `modeArgs`, abaixo, e só nos modos que precisam dela para não travar.
  extraArgs: []
  env: {}

  # Verificado contra `copilot --help` e `copilot help permissions` (binário
  # 1.0.88 nesta máquina em 2026-09-26): o único modo nativo de "só analisar, não agir" é
  # `--mode plan` (choices: interactive, plan, autopilot) — o agente entra em
  # modo de plano e não invoca ferramentas de escrita/execução, então não
  # precisa de `--allow-all-tools` para não travar em modo não-interativo.
  #
  # Para `semi`/`autonomous`, `--allow-all-tools` é OBRIGATÓRIO: a própria
  # descrição da flag no --help diz "required for non-interactive mode" — sem
  # ela, qualquer ferramenta que peça confirmação trava esperando um humano
  # que não existe no `-p` headless do Hub, até estourar o heartbeat.
  #
  # O Copilot NÃO tem um terceiro nível nativo entre "só planeja" e "libera
  # tudo": não há sandbox de escrita nem allow-list granular estável o
  # bastante para diferenciar semi de autonomous sem arriscar travar tarefas
  # legítimas (as flags `--allow-tool`/`--deny-tool` existem, mas exigem saber
  # de antemão os nomes exatos de ferramenta que cada tarefa vai precisar).
  # Por isso os dois modos usam a mesma flag — ver caveat abaixo.
  modeArgs:
    supervised: ["--mode", "plan"]
    semi: ["--allow-all-tools"]
    autonomous: ["--allow-all-tools"]

# Verificado contra `copilot --help` (1.0.88): `--model <model>` — "use 'auto'
# to let Copilot pick automatically". Sem modelo, o Copilot segue no auto.
model:
  supported: true
  args: ["--model", "{{model}}"]
  format: "id do modelo do Copilot (ex.: gpt-5.4) ou `auto`"

verified:
  status: verified
  version: "1.0.88"
  date: "2026-09-26"
  notes: "flags conferidas no `copilot --help` 1.0.88 (so --help/--version, sem chamada de modelo)"

session:
  # `--resume=<id>` existe e foi confirmado no help; o id vem no evento `result`,
  # no fim da execução — tarde, mas suficiente para o próximo turno.
  strategy: native

stream:
  format: jsonl
  mapper: copilot

capabilities:
  - code-edit
  - shell
  - github

auth:
  mode: inherit
  loginHint: "rode `copilot login` e autentique com sua conta GitHub"

defaults:
  isolation: worktree
  timeoutSeconds: 1800
  supervision: supervised

caveats:
  - "O help diz que `--allow-all-tools` é necessário para modo não-interativo. Sem ele, tarefas que precisem de ferramenta podem parar esperando confirmação e estourar o heartbeat — prefira `--allow-tool=<ferramenta>` em extraArgs a liberar tudo."
  - "modeArgs verificado contra `copilot --help` e `copilot help permissions` (1.0.88): supervised usa `--mode plan` (analisa, não age — restrição real). semi e autonomous são IDÊNTICOS (`--allow-all-tools`): o Copilot não tem um modo intermediário nativo, e sem essa flag o CLI trava em modo não-interativo (é o que o próprio --help documenta). A diferença entre semi e autonomous, neste agente, fica inteiramente por conta da vigilância reativa e do portão de aprovação do Hub — não do Copilot."
  - "Fatura em AI Credits (1 crédito = US$ 0,01). O `--output-format json` só traz o ACUMULADO da sessão em `session.usage_checkpoint` (nano-AIU) e os tokens de saída por mensagem; o Hub converte os créditos em dólar e cobra o incremento do turno. Tokens de entrada/cache não vêm no JSONL (`assistant.usage` e `session.shutdown` ficam de fora da saída), então o contador de tokens do Copilot sai por baixo."
  - "Sem modelo definido no Hub, o Copilot escolhe sozinho (`auto`, evento `session.auto_mode_resolved`) e a estimativa de custo usa o que ele escolheu, que muda entre execuções. Com modelo definido, o Hub passa `--model`."
  - "O id da sessão só aparece no evento final `result`, então o resume nativo só vale a partir do segundo turno."
