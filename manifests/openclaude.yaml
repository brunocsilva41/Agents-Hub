id: openclaude
name: OpenClaude
vendor: comunidade (fork do Claude Code)
description: >
  Fork do Claude Code com a mesma superfície de flags e o mesmo formato de
  stream-json — por isso reaproveita o mapper do Claude sem uma linha de código
  nova. Diferencial: multi-provider (anthropic, openai, gemini, github, bedrock,
  vertex, ollama), o que o torna útil como rota alternativa quando um provedor
  está fora ou caro.

bin: openclaude

detect:
  args: ["--version"]
  versionRegex: "(\\d+\\.\\d+\\.\\d+)"

invoke:
  # Verificado contra o binário 0.13.0 (flags reconferidas no --help 0.14.0): mesma forma do Claude Code.
  oneShot: ["-p", "--output-format", "stream-json", "--verbose"]
  resume: ["-p", "--resume", "{{nativeSessionId}}", "--output-format", "stream-json", "--verbose"]
  stdinPrompt: true
  interactive: false
  # Sem `--allow-dangerously-skip-permissions` nem `--permission-mode
  # bypassPermissions`: quem concede permissão aqui é a política do Hub.
  extraArgs: []
  env: {}

  # Verificado contra `openclaude --help` (binário real 0.13.0, reconferido na 0.14.0 nesta
  # máquina): `--permission-mode` existe com o MESMO vocabulário do Claude
  # Code (choices: acceptEdits, bypassPermissions, default, dontAsk, plan,
  # auto — um superconjunto do Claude, que só usa plan/acceptEdits/
  # bypassPermissions). Mesma política do claude.yaml: nunca usar
  # `bypassPermissions`.
  modeArgs:
    supervised: ["--permission-mode", "plan"]
    semi: ["--permission-mode", "acceptEdits"]
    autonomous: ["--permission-mode", "acceptEdits"]

# Gate pré-execução POR SESSÃO. Verificado contra `openclaude --help` (0.14.0):
# `--settings <file-or-json>` carrega settings ADICIONAIS. O Hub grava em
# <AGENTS_HUB_HOME>/run/<sessão>-settings.json o mesmo hook PreToolUse que
# `hub hooks install` gravaria (comando = bin.js desta instalação, matcher de
# risco, timeout 120 s) e apaga o arquivo quando a sessão termina. Assim toda
# sessão subida pelo Hub é gateada, com ou sem o hook no settings.json do
# usuário — que não é tocado. Se o usuário também tiver o hook instalado, o
# Claude soma as duas fontes: comando idêntico é deduplicado por ele mesmo, e
# o daemon responde a mesma decisão para o mesmo tool_use_id (uma aprovação só).
gate:
  settingsArgs: ["--settings", "{{settingsFile}}"]

# Verificado contra `openclaude --help` (0.14.0): `--model <model>`, mesma
# semântica do Claude Code; o provedor vem das variáveis de ambiente.
model:
  supported: true
  args: ["--model", "{{model}}"]
  format: "alias ou nome completo do modelo do provedor configurado"

verified:
  status: verified
  version: "0.14.0"
  date: "2026-09-26"
  notes: "flags conferidas no `openclaude --help` 0.14.0 (so --help/--version, sem chamada de modelo)"

session:
  strategy: native

stream:
  format: jsonl
  # Mesmo envelope do Claude Code (system/assistant/user/result).
  mapper: claude

capabilities:
  - code-edit
  - refactor
  - test-writing
  - code-review
  - debug
  - shell
  - multi-provider

auth:
  mode: inherit
  loginHint: "configure o provedor com as variáveis de ambiente da sua escolha (ANTHROPIC_API_KEY, OPENAI_API_KEY, ...)"

defaults:
  isolation: worktree
  timeoutSeconds: 1800
  supervision: semi

caveats:
  - "Sendo fork, o formato do stream-json pode divergir do Claude Code entre versões — se a timeline empobrecer, é o primeiro lugar a olhar."
  - "Aceita `--session-id <uuid>` definido por quem chama: dá para o Hub fixar o id em vez de extraí-lo da saída (melhoria futura do adapter)."
  - "O modelo e o provedor dependem de variáveis de ambiente; a estimativa de custo usa o modelo que ele reportar, não um padrão fixo."
  - "modeArgs verificado contra `openclaude --help`: dialeto idêntico ao Claude Code (--permission-mode plan/acceptEdits), confirmado no --help e não apenas suposto por ser fork."
