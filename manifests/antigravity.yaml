id: antigravity
name: Antigravity CLI
vendor: Google
description: >
  CLI em Go do Antigravity 2.0, sucessor do Gemini CLI (que deixou de servir
  Pro/Ultra em jun/2026). Startup rápido e bom em ambiente headless/SSH.

bin: antigravity

detect:
  args: ["--version"]
  versionRegex: "(\\d+\\.\\d+\\.\\d+)"

invoke:
  oneShot: ["-p"]
  stdinPrompt: true
  interactive: false
  extraArgs: []
  env: {}

session:
  strategy: replay

stream:
  format: text
  mapper: generic-text

capabilities:
  - code-edit
  - refactor
  - browser
  - multi-agent

auth:
  mode: inherit
  loginHint: "rode `antigravity` e autentique com sua conta Google"

defaults:
  isolation: worktree
  timeoutSeconds: 1800
  supervision: supervised

caveats:
  - "NAO VERIFICADO: as flags aqui vem da documentacao da Antigravity CLI, nao de teste contra binario."
  - "O que ESTA instalado nesta maquina e o Antigravity Hub (app Electron, v2.1.4) e a Antigravity IDE (fork do VS Code, 1.107.0) — nenhum dos dois expoe agente headless. O launcher `antigravity-ide` so tem as opcoes de editor do VS Code."
  - "Por dentro, o app sobe um `language_server.exe --standalone --subclient_type hub` com servidor HTTPS local em PORTA DINAMICA e CSRF token por sessao, em protocolo interno. Da para falar com ele, mas seria adapter fragil: porta muda a cada boot, token muda a cada sessao, e o protocolo quebra a cada atualizacao automatica."
  - "O caminho suportado e a Antigravity CLI (binario Go), produto separado do app e da IDE. Enquanto ela nao estiver no PATH, este manifesto nao roda."
  - "Antigravity tem seu proprio gerenciador de agentes; usar os dois em paralelo pode duplicar trabalho."
