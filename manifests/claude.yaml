id: claude
name: Claude Code
vendor: Anthropic
description: >
  Agente de terminal da Anthropic. Superfície programável mais rica do conjunto:
  stream-json evento a evento, custo por turno, resume nativo e hooks.

bin: claude

detect:
  args: ["--version"]
  versionRegex: "(\\d+\\.\\d+\\.\\d+)"

invoke:
  # `--verbose` é o que faz o stream-json emitir os eventos intermediários;
  # sem ele só chega o resultado final e a timeline ao vivo fica vazia.
  oneShot: ["-p", "--output-format", "stream-json", "--verbose"]
  resume: ["-p", "--resume", "{{nativeSessionId}}", "--output-format", "stream-json", "--verbose"]
  stdinPrompt: true
  interactive: false
  extraArgs: []
  env: {}

  # O modo do Hub vira o modo de permissão nativo do Claude Code.
  #
  # `plan` é read-only de verdade: em supervised o agente analisa e propõe, mas
  # não altera. `acceptEdits` deixa editar dentro do diretório sem perguntar a
  # cada arquivo — o que é seguro justamente porque o diretório é o worktree
  # isolado da sessão, e porque o gate pré-execução continua ativo por cima.
  #
  # `bypassPermissions` NÃO é usado em nenhum modo: seria abrir mão do controle
  # que o Hub existe para exercer.
  modeArgs:
    supervised: ["--permission-mode", "plan"]
    semi: ["--permission-mode", "acceptEdits"]
    autonomous: ["--permission-mode", "acceptEdits"]

session:
  strategy: native
  idFrom: "$.session_id"

stream:
  format: jsonl
  mapper: claude

capabilities:
  - code-edit
  - refactor
  - test-writing
  - code-review
  - debug
  - shell
  - planning
  - long-context

auth:
  mode: inherit
  loginHint: "rode `claude` uma vez no terminal para autenticar"

defaults:
  isolation: worktree
  timeoutSeconds: 1800
  supervision: semi

caveats:
  - "O Hub define `--permission-mode` conforme o modo da sessão; `bypassPermissions` nunca é usado."
  - "Em modo supervised o Claude entra em `plan`: analisa e propõe, mas não altera arquivo nenhum."
  - "No Windows, `interrupt` degrada para cancelamento: SIGINT não é entregável de forma confiável."
