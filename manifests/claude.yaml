id: claude
name: Claude Code
vendor: Anthropic
description: >
  Agente de terminal da Anthropic. Superfície programável mais rica do conjunto:
  stream-json evento a evento, custo por turno, resume nativo e hooks.

bin: claude

detect:
  args: ["--version"]
  versionRegex: "(\\d+\\.\\d+\\.\\d+)"

invoke:
  # `--verbose` é o que faz o stream-json emitir os eventos intermediários;
  # sem ele só chega o resultado final e a timeline ao vivo fica vazia.
  oneShot: ["-p", "--output-format", "stream-json", "--verbose"]
  resume: ["-p", "--resume", "{{nativeSessionId}}", "--output-format", "stream-json", "--verbose"]
  stdinPrompt: true
  interactive: false
  extraArgs: []
  env: {}

  # O modo do Hub vira o modo de permissão nativo do Claude Code.
  #
  # `plan` é read-only de verdade: em supervised o agente analisa e propõe, mas
  # não altera. `acceptEdits` deixa editar dentro do diretório sem perguntar a
  # cada arquivo — o que é seguro justamente porque o diretório é o worktree
  # isolado da sessão, e porque o gate pré-execução continua ativo por cima.
  #
  # `bypassPermissions` NÃO é usado em nenhum modo: seria abrir mão do controle
  # que o Hub existe para exercer.
  modeArgs:
    supervised: ["--permission-mode", "plan"]
    semi: ["--permission-mode", "acceptEdits"]
    autonomous: ["--permission-mode", "acceptEdits"]

# Gate pré-execução POR SESSÃO. Verificado contra `claude --help` (2.1.283):
# `--settings <file-or-json>` carrega settings ADICIONAIS. O Hub grava em
# <AGENTS_HUB_HOME>/run/<sessão>-settings.json o mesmo hook PreToolUse que
# `hub hooks install` gravaria (comando = bin.js desta instalação, matcher de
# risco, timeout 120 s) e apaga o arquivo quando a sessão termina. Assim toda
# sessão subida pelo Hub é gateada, com ou sem o hook no settings.json do
# usuário — que não é tocado. Se o usuário também tiver o hook instalado, o
# Claude soma as duas fontes: comando idêntico é deduplicado por ele mesmo, e
# o daemon responde a mesma decisão para o mesmo tool_use_id (uma aprovação só).
gate:
  settingsArgs: ["--settings", "{{settingsFile}}"]

# Verificado contra `claude --help` (2.1.283): `--model <model>` aceita alias
# (`sonnet`, `opus`) ou nome completo (`claude-sonnet-4-6`).
model:
  supported: true
  args: ["--model", "{{model}}"]
  format: "alias (sonnet, opus) ou nome completo do modelo"

verified:
  status: verified
  version: "2.1.283"
  date: "2026-09-26"
  notes: "flags conferidas no `claude --help` 2.1.283 (so --help/--version, sem chamada de modelo)"

session:
  strategy: native
  # `--resume` de uma conversa que o Claude nunca gravou (turno interrompido
  # antes do `system/init`): o 2.1.285 escreve isto no stderr e sai com 1, com
  # um `result` `error_during_execution` sem texto. O Hub refaz o turno em
  # replay em vez de dar a tarefa por falha (teste real de 2026-09-29).
  nativeSessionMissing: ["No conversation found with session ID"]

stream:
  format: jsonl
  mapper: claude

capabilities:
  - code-edit
  - refactor
  - test-writing
  - code-review
  - debug
  - shell
  - planning
  - long-context

auth:
  mode: inherit
  loginHint: "rode `claude` uma vez no terminal para autenticar"

defaults:
  isolation: worktree
  timeoutSeconds: 1800
  supervision: semi

caveats:
  - "O Hub define `--permission-mode` conforme o modo da sessão; `bypassPermissions` nunca é usado."
  - "Em modo supervised o Claude entra em `plan`: analisa e propõe, mas não altera arquivo nenhum."
  - "No Windows, `interrupt`/`pause` encerram o processo do turno (SIGINT não é entregável); a sessão fica ociosa/pausada e `send` a retoma com `--resume`."
