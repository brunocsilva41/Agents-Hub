id: kimi
name: Kimi Code CLI
vendor: Moonshot AI
description: >
  CLI da Moonshot (ex-"Kimi CLI", renomeado em jan/2026). Suporta ACP para
  editores e MCP para ferramentas, com modo headless e saída em stream-json.

bin: kimi

detect:
  args: ["--version"]
  versionRegex: "(\\d+\\.\\d+\\.\\d+)"

invoke:
  # Verificado contra o binário: `-p` recebe o TEXTO do prompt como valor
  # (não stdin), e `--output-format stream-json` emite um JSON por linha.
  oneShot: ["-p", "{{prompt}}", "--output-format", "stream-json"]
  resume: ["-p", "{{prompt}}", "--session", "{{nativeSessionId}}", "--output-format", "stream-json"]
  stdinPrompt: false
  interactive: false
  extraArgs: []
  env: {}

  # Verificado contra o kimi 2.0.0 (binário real; `--help` e o bundle do
  # `kimi.exe`, sem chamar modelo):
  # - `-p` REJEITA `--yolo`, `--auto` e `--plan` ("Cannot combine --prompt
  #   with --yolo/--auto/--plan", exit 1). O manifesto antigo mandava `-y` em
  #   semi e `--auto` em autonomous: toda sessão nesses modos morria na hora.
  # - No modo `-p` o Kimi FORÇA a permissão "auto" (nunca pergunta), em sessão
  #   nova e retomada. Não há como pedir "pergunte" headless.
  # - O que restringe de verdade é o perfil do agente: `--agent plan` é o
  #   perfil embutido só-leitura (Read, Glob, Grep, ReadMediaFile, WebSearch,
  #   FetchURL, NotifyUser — sem Bash, Write nem Edit). Perfis embutidos:
  #   plan, agent (padrão), coder, explore.
  # - `--agent` não combina com `--session` (o perfil fica preso à sessão na
  #   criação), por isso o resume não repete a flag: `resumeModeArgs`.
  modeArgs:
    supervised: ["--agent", "plan"]
    semi: []
    autonomous: []
  resumeModeArgs:
    supervised: []
    semi: []
    autonomous: []

# Verificado contra `kimi --help` (2.0.0): `-m, --model <model>` — "LLM model
# alias to use for this invocation. Defaults to default_model in config.toml".
model:
  supported: true
  args: ["-m", "{{model}}"]
  format: "alias de modelo do config.toml do Kimi"

verified:
  status: verified
  version: "2.0.0"
  date: "2026-09-26"
  notes: "flags conferidas no `kimi --help` 2.0.0 (so --help/--version, sem chamada de modelo); supervised = `--agent plan` (o `-p` recusa --plan/-y/--auto, conferido no binário)"

session:
  strategy: native

stream:
  format: jsonl
  mapper: kimi

capabilities:
  - code-edit
  - refactor
  - shell
  - swarm

auth:
  mode: inherit
  loginHint: "rode `kimi login` (fluxo de device code)"

defaults:
  isolation: worktree
  timeoutSeconds: 1800
  supervision: supervised

caveats:
  - "Modo (kimi 2.0.0): supervised = perfil embutido `plan` (só leitura: sem shell nem escrita); semi e autonomous = perfil padrão, e o `-p` do Kimi força a permissão 'auto' (nunca pergunta) — os dois rodam iguais, o que muda é só a política do Hub por cima. `-y`/`--auto`/`--plan` não existem junto de `-p` nesta versão."
  - "Se o modo mudar entre turnos, o resume NÃO troca o perfil: ele fica preso à sessão desde a criação (`--agent` não combina com `--session`)."
  - "O id da sessão só chega no evento final `session.resume_hint`, então o resume nativo só vale a partir do segundo turno; kill/timeout antes do fim perde o id."
  - "O stream-json da 2.0.0 NÃO traz uso de tokens (conferido no bundle: só `assistant`, `tool`, `meta` de versão/retentativa/resume): o custo do Hub sai estimado pelo modelo padrão do agente."
  - "Falha de rede/provedor: o Kimi retenta até 10 vezes com backoff (minutos); cada tentativa vira aviso legível na timeline (a última avisa que é a última) e, esgotadas, o processo sai com código 1 e a mensagem no stderr."
  - "Suporta ACP (`kimi acp`) — candidato a integração mais rica na fase 3."
