id: kimi
name: Kimi Code CLI
vendor: Moonshot AI
description: >
  CLI da Moonshot (ex-"Kimi CLI", renomeado em jan/2026). Suporta ACP para
  editores e MCP para ferramentas, com modo headless e saída em stream-json.

bin: kimi

detect:
  args: ["--version"]
  versionRegex: "(\\d+\\.\\d+\\.\\d+)"

invoke:
  # Verificado contra o binário: `-p` recebe o TEXTO do prompt como valor
  # (não stdin), e `--output-format stream-json` emite um JSON por linha.
  oneShot: ["-p", "{{prompt}}", "--output-format", "stream-json"]
  resume: ["-p", "{{prompt}}", "--session", "{{nativeSessionId}}", "--output-format", "stream-json"]
  stdinPrompt: false
  interactive: false
  # `--yolo`/`--auto` entram só via `modeArgs`, abaixo — nunca fixos aqui.
  extraArgs: []
  env: {}

  # Verificado contra `kimi --help` (2.0.0, binário real nesta máquina):
  # `--plan`: "Start in plan mode" — o agente planeja em vez de agir; é o
  # equivalente do `--permission-mode plan` do Claude e vira o supervised
  # (antes supervised ia sem flag nenhuma, e o modo padrão "ainda pergunta"
  # não tinha quem respondesse no `-p` headless).
  # `-y`/`--yolo`: "Ask When Needed" — edições e comandos rotineiros rodam
  # sozinhos; ações arriscadas, perguntas e planos ainda pedem confirmação.
  # `--auto`: "Never Ask" — nunca interrompe, tudo decidido sozinho.
  modeArgs:
    supervised: ["--plan"]
    semi: ["-y"]
    autonomous: ["--auto"]

# Verificado contra `kimi --help` (2.0.0): `-m, --model <model>` — "LLM model
# alias to use for this invocation. Defaults to default_model in config.toml".
model:
  supported: true
  args: ["-m", "{{model}}"]
  format: "alias de modelo do config.toml do Kimi"

verified:
  status: verified
  version: "2.0.0"
  date: "2026-09-26"
  notes: "flags conferidas no `kimi --help` 2.0.0 (so --help/--version, sem chamada de modelo); `--plan` em supervised conferido so no --help"

session:
  strategy: native

stream:
  format: jsonl
  mapper: kimi

capabilities:
  - code-edit
  - refactor
  - shell
  - swarm

auth:
  mode: inherit
  loginHint: "rode `kimi login` (fluxo de device code)"

defaults:
  isolation: worktree
  timeoutSeconds: 1800
  supervision: supervised

caveats:
  - "modeArgs verificado contra `kimi --help` 2.0.0: supervised usa `--plan` (modo de plano), semi `-y` e autonomous `--auto`. O `--plan` combinado com `-p` headless foi conferido só no --help, não numa execução real: se o Kimi pedir aprovação do plano, não há quem responda e a run pode ficar pendurada até o timeout do Hub."
  - "O id da sessão só chega no evento final `session.resume_hint`, então o resume nativo só vale a partir do segundo turno."
  - "Não reporta uso de tokens nas execuções observadas: o custo do Hub sai estimado pelo modelo padrão do agente."
  - "A 2.0.0 (instalada em 2026-09-26) já é a reescrita em Bun+TypeScript; o formato do stream-json mudou em relação à linha Python e pode mudar de novo entre versões."
  - "Suporta ACP (`kimi acp`) — candidato a integração mais rica na fase 3."
