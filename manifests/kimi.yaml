id: kimi
name: Kimi Code CLI
vendor: Moonshot AI
description: >
  CLI da Moonshot (ex-"Kimi CLI", renomeado em jan/2026). Suporta ACP para
  editores e MCP para ferramentas, com modo headless e saída em stream-json.

bin: kimi

detect:
  args: ["--version"]
  versionRegex: "(\\d+\\.\\d+\\.\\d+)"

invoke:
  # Verificado contra o binário: `-p` recebe o TEXTO do prompt como valor
  # (não stdin), e `--output-format stream-json` emite um JSON por linha.
  oneShot: ["-p", "{{prompt}}", "--output-format", "stream-json"]
  resume: ["-p", "{{prompt}}", "--session", "{{nativeSessionId}}", "--output-format", "stream-json"]
  stdinPrompt: false
  interactive: false
  # `--yolo`/`--auto` entram só via `modeArgs`, abaixo — nunca fixos aqui.
  extraArgs: []
  env: {}

  # Verificado contra `kimi --help` (binário real nesta máquina): os únicos
  # três níveis nativos de permissão são justamente os três modos do Hub.
  # Sem flag: modo padrão, mais restritivo ("ainda pergunta" por padrão).
  # `-y`/`--yolo`: "Ask When Needed" — edições e comandos rotineiros rodam
  # sozinhos; ações arriscadas, perguntas e planos ainda pedem confirmação.
  # `--auto`: "Never Ask" — nunca interrompe, tudo decidido sozinho.
  modeArgs:
    supervised: []
    semi: ["-y"]
    autonomous: ["--auto"]

session:
  strategy: native
  idFrom: "$.session_id"

stream:
  format: jsonl
  mapper: kimi

capabilities:
  - code-edit
  - refactor
  - shell
  - swarm

auth:
  mode: inherit
  loginHint: "rode `kimi login` (fluxo de device code)"

defaults:
  isolation: worktree
  timeoutSeconds: 1800
  supervision: supervised

caveats:
  - "modeArgs verificado contra `kimi --help`: supervised roda SEM flag (o padrão mais restritivo do binário — 'ainda pergunta'). Mas o Hub roda o Kimi headless via `-p`, sem terminal interativo: uma pergunta real não tem quem responda. Não achamos no --help um modo 'recusa automaticamente o que pediria pergunta' — o binário não oferece esse equivalente, então em supervised uma ação que peça confirmação pode ficar pendurada até o timeout do Hub em vez de ser negada de forma limpa."
  - "O id da sessão só chega no evento final `session.resume_hint`, então o resume nativo só vale a partir do segundo turno."
  - "Não reporta uso de tokens nas execuções observadas: o custo do Hub sai estimado pelo modelo padrão do agente."
  - "Projeto migrando de Python para Bun+TypeScript; o formato do stream-json pode mudar entre versões."
  - "Suporta ACP (`kimi acp`) — candidato a integração mais rica na fase 3."
