id: codex
name: OpenAI Codex CLI
vendor: OpenAI
description: >
  CLI da OpenAI. Emite JSONL de eventos em `codex exec --json` e retoma threads
  nativamente. Também roda como servidor MCP (`codex mcp`), então orquestra e é
  orquestrado sem adaptação.

bin: codex

detect:
  args: ["--version"]
  versionRegex: "(\\d+\\.\\d+\\.\\d+)"

invoke:
  # O `-` final faz o Codex ler o prompt de stdin.
  # `--skip-git-repo-check` existe em `exec` e em `exec resume` (0.155.0): sem
  # ele o Codex recusa rodar fora de repositório git ("Not inside a trusted
  # directory"), o que quebrava sessões `isolation: none` em pasta sem git.
  oneShot: ["exec", "--json", "--skip-git-repo-check", "-"]
  resume: ["exec", "resume", "{{nativeSessionId}}", "--json", "--skip-git-repo-check", "-"]
  stdinPrompt: true
  interactive: false
  extraArgs: []
  env: {}

  # O modo do Hub vira a política de sandbox do próprio Codex.
  #
  # Sem isto, o Codex recusava escrever no worktree que o Hub tinha acabado de
  # criar para ele: o diretório não está na lista de projetos confiáveis do
  # ~/.codex/config.toml, então caía em somente-leitura. A tarefa falhava por um
  # motivo que não tinha nada a ver com a tarefa.
  #
  # `workspace-write` limita a escrita ao diretório de trabalho — que É o
  # worktree isolado. As duas camadas passam a concordar em vez de brigar.
  # `-c sandbox_mode=...`, e NÃO `--sandbox`.
  #
  # `--sandbox` só existe em `codex exec`. Em `codex exec resume` ele não é
  # reconhecido, e como o Hub anexa `modeArgs` às duas invocações, TODA
  # retomada de conversa falhava com código 2:
  #
  #   error: unexpected argument '--sandbox' found
  #   Usage: codex exec resume --json <SESSION_ID> <PROMPT>
  #
  # O estrago ia além de `hub send`: a retentativa do pipeline de resiliência
  # também resume, então ela queimava tentativa por um motivo que não tinha
  # relação com a tarefa, e o fallback trocava de agente culpando o errado.
  #
  # `-c` existe nos dois subcomandos, e `sandbox_mode` foi verificado contra o
  # binário: com `read-only`, o agente é impedido de escrever e relata o
  # "Acesso negado".
  modeArgs:
    supervised: ["-c", 'sandbox_mode="read-only"']
    semi: ["-c", 'sandbox_mode="workspace-write"']
    autonomous: ["-c", 'sandbox_mode="workspace-write"']

# Verificado contra `codex exec --help` E `codex exec resume --help` (0.155.0):
# `-m, --model <MODEL>` existe nos dois subcomandos (diferente de `--sandbox`,
# que só existe em `exec` — ver modeArgs).
model:
  supported: true
  args: ["-m", "{{model}}"]
  format: "id do modelo (ex.: o3, como no exemplo do `codex exec --help`)"

verified:
  status: verified
  version: "0.155.0"
  date: "2026-09-26"
  notes: "flags conferidas no `codex exec --help` e `codex exec resume --help` 0.155.0 (so --help/--version, sem chamada de modelo)"

session:
  strategy: native

stream:
  format: jsonl
  mapper: codex

capabilities:
  - code-edit
  - refactor
  - test-writing
  - code-review
  - debug
  - shell
  - planning

auth:
  mode: inherit
  loginHint: "rode `codex login` (ou configure ~/.codex/config.toml)"

defaults:
  isolation: worktree
  timeoutSeconds: 1800
  supervision: semi

caveats:
  - "O Hub passa `-c sandbox_mode=...` conforme o modo da sessão (não `--sandbox`, que não existe em `exec resume`), sobrepondo o padrão do ~/.codex/config.toml. Nunca usa `--dangerously-bypass-approvals-and-sandbox`."
  - "`--skip-git-repo-check` vai sempre: sem ele, `isolation: none` numa pasta sem git falhava com 'Not inside a trusted directory'. Quem decide se a pasta é confiável é o Hub (projeto confiado), não a lista do Codex."
  - "Em modo supervised o Codex fica em read-only: ele NÃO conseguirá editar arquivos. Use semi ou autonomous para tarefas de escrita."
