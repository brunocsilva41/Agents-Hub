id: codex
name: OpenAI Codex CLI
vendor: OpenAI
description: >
  CLI da OpenAI. Emite JSONL de eventos em `codex exec --json` e retoma threads
  nativamente. Também roda como servidor MCP (`codex mcp`), então orquestra e é
  orquestrado sem adaptação.

bin: codex

detect:
  args: ["--version"]
  versionRegex: "(\\d+\\.\\d+\\.\\d+)"

invoke:
  # O `-` final faz o Codex ler o prompt de stdin.
  oneShot: ["exec", "--json", "-"]
  resume: ["exec", "resume", "{{nativeSessionId}}", "--json", "-"]
  stdinPrompt: true
  interactive: false
  extraArgs: []
  env: {}

  # O modo do Hub vira a política de sandbox do próprio Codex.
  #
  # Sem isto, o Codex recusava escrever no worktree que o Hub tinha acabado de
  # criar para ele: o diretório não está na lista de projetos confiáveis do
  # ~/.codex/config.toml, então caía em somente-leitura. A tarefa falhava por um
  # motivo que não tinha nada a ver com a tarefa.
  #
  # `workspace-write` limita a escrita ao diretório de trabalho — que É o
  # worktree isolado. As duas camadas passam a concordar em vez de brigar.
  modeArgs:
    supervised: ["--sandbox", "read-only"]
    semi: ["--sandbox", "workspace-write"]
    autonomous: ["--sandbox", "workspace-write"]

session:
  strategy: native
  idFrom: "$.thread_id"

stream:
  format: jsonl
  mapper: codex

capabilities:
  - code-edit
  - refactor
  - test-writing
  - code-review
  - debug
  - shell
  - planning

auth:
  mode: inherit
  loginHint: "rode `codex login` (ou configure ~/.codex/config.toml)"

defaults:
  isolation: worktree
  timeoutSeconds: 1800
  supervision: semi

caveats:
  - "O Hub passa `--sandbox` conforme o modo da sessão, sobrepondo o padrão do ~/.codex/config.toml. Nunca usa `--dangerously-bypass-approvals-and-sandbox`."
  - "Em modo supervised o Codex fica em read-only: ele NÃO conseguirá editar arquivos. Use semi ou autonomous para tarefas de escrita."
