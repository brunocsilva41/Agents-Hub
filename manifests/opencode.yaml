id: opencode
name: OpenCode
vendor: SST (open source)
description: >
  Agente model-agnostic e auto-hospedável. Único do conjunto com servidor HTTP
  próprio (`opencode serve`, REST + OpenAPI 3.1 + SSE), e por isso o único que o
  Hub aciona por HTTP em vez de spawn de processo — é onde estão o id de sessão
  durável, o custo por passo e os eventos estruturados.

bin: opencode

detect:
  args: ["--version"]
  versionRegex: "(\\d+\\.\\d+\\.\\d+)"

# Mantido para o caso de o adapter HTTP não estar disponível: o Hub cai no
# adapter genérico de processo e a sessão ainda roda, só com timeline pobre.
invoke:
  oneShot: ["run"]
  resume: ["run", "--session", "{{nativeSessionId}}"]
  stdinPrompt: true
  interactive: false
  extraArgs: []
  env: {}

  # NÃO PREENCHIDO DE PROPÓSITO. Este agente roda pelo `OpenCodeAdapter`
  # (packages/adapters/src/opencode/adapter.ts), que fala HTTP com
  # `opencode serve` — não passa pelo `ProcessAgentAdapter`, o único lugar do
  # código que lê `invoke.modeArgs` (packages/adapters/src/process-adapter.ts:182).
  # `invoke.oneShot`/`invoke.resume` acima só valem no fallback raro em que o
  # adapter HTTP não está disponível e o Hub cai para spawn de processo — e
  # mesmo nesse fallback, ninguém testou modeArgs junto.
  #
  # O modo do Hub vira permissão nativa por outro caminho: o campo `agent` de
  # `POST /api/session` (e `POST /api/session/{id}/agent` no resume). O
  # servidor que o Hub sobe recebe `OPENCODE_CONFIG_DIR` com três agentes
  # `hub-supervised`/`hub-semi`/`hub-autonomous`, e o adapter escolhe um por
  # modo — ver packages/adapters/src/opencode/permissions.ts e
  # `docs/referencias/opencode-api.md` §8. Medido na 1.18.32: a API v2 não
  # aceita permissão por sessão, e o agente padrão `build` é `allow *`.
  modeArgs:
    supervised: []
    semi: []
    autonomous: []

# Verificado contra `opencode run --help` (1.18.32): `-m, --model` no formato
# provider/model. Estes args só valem no fallback por processo; pelo adapter
# HTTP o modelo vai no corpo de `POST /api/session` (ver opencode/adapter.ts).
model:
  supported: true
  args: ["-m", "{{model}}"]
  format: "provider/model (ex.: zai-coding-plan/glm-4.6)"

verified:
  status: partial
  version: "1.18.32"
  date: "2026-09-26"
  notes: "`opencode run --help` 1.18.32 conferido; a API HTTP do `opencode serve` foi conferida na 1.17.15 e na vistoria de 2026-09-25 (1.18.32), sem sessao real"

session:
  # `GET /api/session/{id}` recupera sessão criada em outro processo do servidor
  # (confirmado contra o binário real), então o id nativo é handle durável.
  strategy: native

stream:
  format: text
  mapper: generic-text

capabilities:
  - code-edit
  - refactor
  - test-writing
  - shell
  - local-models

auth:
  mode: inherit
  loginHint: "rode `opencode auth login` e escolha o provedor de modelo"

defaults:
  isolation: worktree
  timeoutSeconds: 1800
  supervision: semi

caveats:
  - "O Hub sobe um `opencode serve` em 127.0.0.1:4790 se não houver um respondendo, e só derruba o que ele mesmo subiu."
  - "O servidor roda sem senha (ele avisa no boot); por isso nunca é exposto além de 127.0.0.1."
  - "A rota de replay por sessão (`GET /api/session/{id}/event`) derrubava a conexão na 1.17.15 (não reconferido na 1.18.32 instalada), então o stream abre antes do prompt e eventos perdidos não voltam."
  - "Modelo e agente só valem na criação da sessão: passá-los no corpo do prompt é silenciosamente ignorado pelo servidor."
  - "Modo → permissão (verificado na 1.18.32 avaliando regras por `POST /api/session/{id}/permission`, sem chamar modelo): supervised = agente `hub-supervised` (só leitura: edição, shell, rede, subagentes e ferramentas desconhecidas/MCP negados); semi = `hub-semi` (edita e roda comandos; `git push`, `rm -rf`, `git reset --hard`, publish, sudo, segredos `.env`/`.ssh`, escrita em `.git/hooks` e `.github/workflows` NEGADOS; sem subagentes); autonomous = `hub-autonomous` (como semi, com subagentes). Onde a tabela de risco pede aprovação vira `deny`: o Hub ainda não responde pedido de permissão do OpenCode (um `ask` sem resposta trava o turno), e pedidos que ainda chegam são recusados na hora pelo adapter."
  - "Os agentes `hub-*` só existem no `opencode serve` que o HUB sobe. Com um servidor do usuário já na porta, o adapter cai para os nativos (`plan` em supervised, `build` nos demais) e avisa na timeline: `plan` nega edição mas NÃO barra shell; `build` permite tudo."
  - "A regra de shell casa o texto inteiro do comando (`*git push*` pega `cd x && git push`): é lista de negação, não análise — comando ofuscado passa e fica para a vigilância do Hub."
  - "[~] Ambiente de projeto (`OPENAI_BASE_URL`, `MODEL`, chaves de API etc., via `ProjectContext.env`) chega ao processo real do `opencode serve`, mas com uma limitação estrutural séria: o servidor é UM SÓ, compartilhado por TODAS as sessões deste adapter (não há um servidor por projeto). Ele só lê variáveis de ambiente no `spawn()`, então SÓ a primeira sessão a subir o servidor consegue de fato influenciar provedor/modelo por ambiente. Sessões seguintes de projetos com `env` diferente NÃO têm efeito nenhum sobre um servidor já no ar — o `OpenCodeAdapter` detecta essa divergência e avisa no log do daemon (`[opencode] servidor já está no ar com outro ambiente...`), mas não resolve o conflito. Não existe hoje mecanismo do `opencode serve` para configurar isso por REQUISIÇÃO (confirmado em `docs/referencias/opencode-api.md` §5: nem `model` no corpo do prompt é aceito, muito menos ambiente) — resolver de verdade exigiria um servidor por config/projeto, o que custa ~20s de boot medido no Windows por instância. Não testado contra `opencode serve` real com dois projetos concorrentes nesta tarefa; validado só por leitura de código e da doc da API."
