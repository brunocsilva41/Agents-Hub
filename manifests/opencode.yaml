id: opencode
name: OpenCode
vendor: SST (open source)
description: >
  Agente model-agnostic e auto-hospedável. Único do conjunto com servidor HTTP
  próprio (`opencode serve`, REST + OpenAPI 3.1 + SSE), e por isso o único que o
  Hub aciona por HTTP em vez de spawn de processo — é onde estão o id de sessão
  durável, o custo por passo e os eventos estruturados.

bin: opencode

detect:
  args: ["--version"]
  versionRegex: "(\\d+\\.\\d+\\.\\d+)"

# Mantido para o caso de o adapter HTTP não estar disponível: o Hub cai no
# adapter genérico de processo e a sessão ainda roda, só com timeline pobre.
invoke:
  oneShot: ["run"]
  resume: ["run", "--session", "{{nativeSessionId}}"]
  stdinPrompt: true
  interactive: false
  extraArgs: []
  env: {}

session:
  # `GET /api/session/{id}` recupera sessão criada em outro processo do servidor
  # (confirmado contra o binário real), então o id nativo é handle durável.
  strategy: native
  idFrom: "$.data.sessionID"

stream:
  format: text
  mapper: generic-text

capabilities:
  - code-edit
  - refactor
  - test-writing
  - shell
  - local-models

auth:
  mode: inherit
  loginHint: "rode `opencode auth login` e escolha o provedor de modelo"

defaults:
  isolation: worktree
  timeoutSeconds: 1800
  supervision: semi

caveats:
  - "O Hub sobe um `opencode serve` em 127.0.0.1:4790 se não houver um respondendo, e só derruba o que ele mesmo subiu."
  - "O servidor roda sem senha (ele avisa no boot); por isso nunca é exposto além de 127.0.0.1."
  - "A rota de replay por sessão (`GET /api/session/{id}/event`) derruba a conexão na 1.17.15, então o stream abre antes do prompt e eventos perdidos não voltam."
  - "Modelo e agente só valem na criação da sessão: passá-los no corpo do prompt é silenciosamente ignorado pelo servidor."
