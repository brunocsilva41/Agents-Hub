id: mimo
name: MiMo Code
vendor: Xiaomi
description: >
  CLI da Xiaomi. É um fork do OpenCode — mesma estrutura de comandos (`run`,
  `serve`, `session`, `attach`) e o servidor publica uma OpenAPI cujo título é
  literalmente "opencode". Bom candidato a fallback de baixo custo.

bin: mimo

detect:
  args: ["--version"]
  versionRegex: "(\\d+\\.\\d+\\.\\d+)"

invoke:
  # Verificado contra o binário. ATENÇÃO: `-p` aqui é `--password`, NÃO prompt.
  # O prompt vai por STDIN: o handler de `run` (0.1.14, conferido no bundle do
  # `mimo.exe`) faz `if (!process.stdin.isTTY) message += " " + stdin` e só
  # reclama "You must provide a message" se os dois estiverem vazios. Por argv
  # (posicional) o prompt atravessava o shim `mimo.cmd` e o `cmd.exe`: injeção
  # de comando, truncamento na 1ª quebra de linha e Unicode virando `?`
  # (vistoria 2026-09-25) — e o próprio `run` ainda re-junta os posicionais
  # com aspas à mão, alterando o texto.
  oneShot: ["run", "--format", "json"]
  resume: ["run", "--session", "{{nativeSessionId}}", "--format", "json"]
  stdinPrompt: true
  interactive: false
  extraArgs: []
  env: {}

  # Verificado contra `mimo run --help` (binário real): a ÚNICA flag de
  # permissão disponível no subcomando `run` é `--dangerously-skip-permissions`
  # (alias `--yolo`) — "auto-approve permissions that are not explicitly
  # denied". `mimo --help` (raiz) também lista `--never-ask` e `--trust`, mas
  # nenhum dos dois aparece em `mimo run --help`: são opções do comando
  # default (TUI), não do modo headless que o Hub usa — não achamos
  # equivalente real de restrição parcial para `run`.
  #
  # Por isso supervised e semi ficam IDÊNTICOS (sem flag nenhuma) — não é
  # esquecimento, é ausência confirmada de um meio-termo nativo no `run`.
  modeArgs:
    supervised: []
    semi: []
    autonomous: ["--yolo"]

# Verificado contra `mimo run --help` (0.1.14): `-m, --model` — "model to use in
# the format of provider/model".
model:
  supported: true
  args: ["-m", "{{model}}"]
  format: "provider/model"

verified:
  status: verified
  version: "0.1.14"
  date: "2026-09-26"
  notes: "flags conferidas no `mimo run --help` 0.1.14 (so --help/--version, sem chamada de modelo)"

session:
  strategy: native

stream:
  format: jsonl
  # O `--format json` do MiMo é o envelope `run` da família OpenCode
  # (`{type, sessionID, part}`), que o mapper genérico reconhece — ver
  # packages/adapters/src/mappers/generic.ts.
  mapper: generic-json

capabilities:
  - code-edit
  - test-writing
  - shell
  - low-cost

auth:
  mode: inherit
  loginHint: "rode `mimo providers` para configurar credenciais"

defaults:
  isolation: worktree
  timeoutSeconds: 1800
  supervision: supervised

caveats:
  - "modeArgs verificado contra `mimo run --help`: sem meio-termo nativo no comando headless — supervised e semi rodam sem nenhuma flag de permissão (o que o binário pede por padrão em ações sensíveis não foi confirmado além disso), e só autonomous usa `--yolo`/`--dangerously-skip-permissions`. A diferença entre supervised e semi, neste agente, é só a política do Hub por cima — não o próprio MiMo."
  - "É fork do OpenCode, mas expõe a API v1 LEGADA (rotas na raiz, sem /api) — o adapter HTTP do Hub fala só v2, então este agente roda por CLI."
  - "Envelope do `run --format json` conferido no bundle do `mimo.exe` 0.1.14 (não em execução real, para não chamar provedor): `{type, timestamp, sessionID, part}` com `step_start|text|reasoning|tool_use|step_finish|error`. O mapper `generic-json` entende esse envelope: texto, shell/escrita vigiáveis, erro, id da sessão e custo/tokens do `step_finish` (`part.cost`/`part.tokens`)."
  - "A memória persistente do MiMo vive fora do Hub: o que ele lembra não aparece na auditoria."
  - "session.strategy: native: o `sessionID` de cada linha do `--format json` vira `nativeSessionId` (mapper generic-json), e o turno seguinte usa `run --session <id>`. Validado por teste com o envelope do bundle, não por execução real."
