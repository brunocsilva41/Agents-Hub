id: mimo
name: MiMo Code
vendor: Xiaomi
description: >
  CLI da Xiaomi. É um fork do OpenCode — mesma estrutura de comandos (`run`,
  `serve`, `session`, `attach`) e o servidor publica uma OpenAPI cujo título é
  literalmente "opencode". Bom candidato a fallback de baixo custo.

bin: mimo

detect:
  args: ["--version"]
  versionRegex: "(\\d+\\.\\d+\\.\\d+)"

invoke:
  # Verificado contra o binário. ATENÇÃO: `-p` aqui é `--password`, NÃO prompt —
  # o texto vai como posicional de `run`. A versão anterior deste manifesto
  # mandava o prompt pela flag errada.
  oneShot: ["run", "{{prompt}}", "--format", "json"]
  resume: ["run", "{{prompt}}", "--session", "{{nativeSessionId}}", "--format", "json"]
  stdinPrompt: false
  interactive: false
  extraArgs: []
  env: {}

  # Verificado contra `mimo run --help` (binário real): a ÚNICA flag de
  # permissão disponível no subcomando `run` é `--dangerously-skip-permissions`
  # (alias `--yolo`) — "auto-approve permissions that are not explicitly
  # denied". `mimo --help` (raiz) também lista `--never-ask` e `--trust`, mas
  # nenhum dos dois aparece em `mimo run --help`: são opções do comando
  # default (TUI), não do modo headless que o Hub usa — não achamos
  # equivalente real de restrição parcial para `run`.
  #
  # Por isso supervised e semi ficam IDÊNTICOS (sem flag nenhuma) — não é
  # esquecimento, é ausência confirmada de um meio-termo nativo no `run`.
  modeArgs:
    supervised: []
    semi: []
    autonomous: ["--yolo"]

session:
  strategy: native
  idFrom: "$.sessionID"

stream:
  format: jsonl
  # Sendo fork do OpenCode, os eventos brutos têm forma parecida, mas a versão
  # aqui é mais antiga e o vocabulário não foi confirmado evento a evento.
  # O mapper genérico entrega timeline utilizável sem fingir precisão que não
  # foi verificada.
  mapper: generic-json

capabilities:
  - code-edit
  - test-writing
  - shell
  - low-cost

auth:
  mode: inherit
  loginHint: "rode `mimo providers` para configurar credenciais"

defaults:
  isolation: worktree
  timeoutSeconds: 1800
  supervision: supervised

caveats:
  - "modeArgs verificado contra `mimo run --help`: sem meio-termo nativo no comando headless — supervised e semi rodam sem nenhuma flag de permissão (o que o binário pede por padrão em ações sensíveis não foi confirmado além disso), e só autonomous usa `--yolo`/`--dangerously-skip-permissions`. A diferença entre supervised e semi, neste agente, é só a política do Hub por cima — não o próprio MiMo."
  - "É fork do OpenCode, mas expõe a API v1 LEGADA (rotas na raiz, sem /api) — o adapter HTTP do Hub fala só v2, então este agente roda por CLI."
  - "A API v1 não tem custo por passo; o custo do Hub sai estimado pela tabela de preços."
  - "Vocabulário de eventos do `--format json` não confirmado evento a evento: usa o mapper genérico."
  - "A memória persistente do MiMo vive fora do Hub: o que ele lembra não aparece na auditoria."
