# Build e testes da reescrita nativa em C (native/, ADR 07/08).
#
# Cada combinação configura, compila e roda o ctest com o preset de mesmo nome
# em native/CMakePresets.json. Nenhum passo é opcional: falha em qualquer um
# (configurar, compilar, testar, checkout sujo) falha o job.
#
# Compiladores (ADR 8.2): MSVC no Windows (Debug e Release, o Release é o do
# produto), clang-cl com ASan+UBSan no Windows (o MSVC não tem UBSan) e, no
# Ubuntu 22.04 (base do AppImage, ADR 8.14), GCC Debug e Clang, ambos com
# ASan+UBSan (docs/18 §10). O job `portão nativo` é o único check a exigir.
name: native

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Menor privilégio: nada aqui escreve no repositório.
permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  windows:
    name: native (${{ matrix.preset }})
    # Imagem fixa (não windows-latest): a troca silenciosa da imagem mudaria
    # compilador, CMake e LLVM sem nenhum commit no repositório.
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-msvc-debug, windows-msvc-release, windows-clangcl-asan]
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      # Ninja + cl/clang-cl precisam do ambiente do vcvars64 (INCLUDE, LIB,
      # PATH). Exporta esse ambiente para os passos seguintes sem action de
      # terceiro.
      - name: Ambiente MSVC (vcvars64)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw "Visual Studio com VC Tools x64 não encontrado" }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $envDump = cmd /c "`"$vcvars`" >nul && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat falhou" }
          foreach ($line in $envDump) {
            if ($line -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          }

      - name: Versões das ferramentas
        shell: cmd
        run: |
          cmake --version || exit /b 1
          ninja --version || exit /b 1
          where clang-cl || exit /b 1
          if "${{ matrix.preset }}"=="windows-clangcl-asan" (clang-cl --version || exit /b 1) else (cl)

      - name: Configurar
        run: cmake --preset ${{ matrix.preset }}

      - name: Compilar
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Testar
        run: ctest --preset ${{ matrix.preset }}

      - name: Checkout continua limpo depois do build e dos testes
        shell: bash
        run: |
          sujeira="$(git status --porcelain)"
          if [ -n "$sujeira" ]; then
            echo "::error::build/test alterou arquivos rastreados pelo git"
            echo "$sujeira"
            exit 1
          fi

  linux:
    name: native (${{ matrix.preset }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-gcc-debug, linux-clang-asan]
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      # Ninja não é garantido na imagem do Ubuntu; vem do repositório da distro.
      # Dependências do SDL3 vendorizado (F0-12), conferidas no CMake do
      # SDL 3.4.16 (native/third_party/sdl3/cmake/sdlchecks.cmake e macros.cmake).
      # Erros fatais do configure que dependem de pacote no Linux (todos os
      # FATAL_ERROR de cmake/*.cmake e CMakeLists.txt foram listados; os demais
      # não dependem de pacote):
      # - SDL_missing_dependency (macros.cmake:431), chamado pelo CheckX11 quando
      #   uma extensão ligada por padrão (SDL_X11_*, CMakeLists.txt:342-350)
      #   falta. Header procurado -> pacote do Ubuntu 22.04 (conferido em
      #   packages.ubuntu.com, jammy/amd64, 2026-10-01):
      #     XCURSOR    X11/Xcursor/Xcursor.h        -> libxcursor-dev
      #     XDBE       X11/extensions/Xdbe.h        -> libxext-dev
      #     XINPUT     X11/extensions/XInput2.h     -> libxi-dev
      #     XFIXES     X11/extensions/Xfixes.h (+ XInput2.h) -> libxfixes-dev
      #     XSYNC      X11/extensions/sync.h        -> libxext-dev
      #     XRANDR     X11/extensions/Xrandr.h      -> libxrandr-dev
      #     XSCRNSAVER X11/extensions/scrnsaver.h   -> libxss-dev
      #     XSHAPE     X11/extensions/shape.h       -> libxext-dev
      #     XTEST      X11/extensions/XTest.h       -> libxtst-dev
      #   e o núcleo X11/Xlib.h e X11/extensions/Xext.h -> libx11-dev, libxext-dev.
      # - "SDL could not find X11 or Wayland" (macros.cmake:415): coberto pelo X11
      #   acima.
      # Sem erro fatal quando faltam (só aviso ou recurso desligado), mas
      # instalados porque a UI precisa deles:
      # - pkg-config: o CheckWayland e a busca de dbus/ibus usam pkg-config;
      # - Wayland (CheckWayland, sdlchecks.cmake:643): libwayland-dev
      #   (wayland-client/egl/cursor e wayland-scanner), libegl-dev ("egl"),
      #   libxkbcommon-dev, libdecor-0-dev (decoração de janela);
      # - IME: libdbus-1-dev (fcitx via dbus) e libibus-1.0-dev (ibus).
      # Fora de propósito, para o empacotamento da F8: áudio, udev, drm/gbm,
      # fribidi, libthai (sem erro fatal; o SDL desliga o recurso).
      # Para rodar o teste de janela (unit.ui_smoke) sem monitor: xvfb (servidor
      # X virtual) e fonts-dejavu-core (DejaVu Sans, a fonte que o teste usa no
      # Linux; nenhuma fonte é vendorizada).
      - name: Instalar Ninja e dependências do SDL3
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxrandr-dev libxss-dev libxtst-dev \
            libwayland-dev libegl-dev libxkbcommon-dev libdecor-0-dev \
            libdbus-1-dev libibus-1.0-dev \
            xvfb fonts-dejavu-core

      - name: Versões das ferramentas
        run: |
          cmake --version
          ninja --version
          gcc --version
          clang --version

      - name: Configurar
        run: cmake --preset ${{ matrix.preset }}

      - name: Compilar
        run: cmake --build --preset ${{ matrix.preset }}

      # O ASan de LLVM < 18 trava ao iniciar em kernels com
      # vm.mmap_rnd_bits=32; o Clang padrão do Ubuntu 22.04 é anterior a isso.
      # Os dois presets Linux usam ASan (o do GCC também, docs/18 §10), e o
      # libasan do GCC 11 vem do mesmo compiler-rt antigo, por isso o passo vale
      # para ambos. NÃO confirmado neste runner: é precaução. O runner é
      # descartável, então o sysctl não afeta nada fora deste job.
      - name: Ajustar vm.mmap_rnd_bits para o ASan (precaução)
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      # Sob xvfb-run (-a: escolhe um número de display livre; tela fixa de
      # 1280x1024 com 24 bits de cor), para o unit.ui_smoke abrir a janela SDL3
      # de verdade em vez de ficar em skip.
      - name: Testar
        run: xvfb-run -a -s "-screen 0 1280x1024x24" ctest --preset ${{ matrix.preset }}

      - name: Checkout continua limpo depois do build e dos testes
        run: |
          sujeira="$(git status --porcelain)"
          if [ -n "$sujeira" ]; then
            echo "::error::build/test alterou arquivos rastreados pelo git"
            echo "$sujeira"
            exit 1
          fi

  # ------------------------------------------------------------ o único gate
  # Mesmo modelo do `portão de qualidade` do ci.yml: a proteção de branch exige
  # checks pelo nome, e o nome de cada combinação da matriz muda quando um
  # preset entra ou sai. Este job é o ÚNICO check que a proteção precisa exigir:
  # `needs` espera TODAS as combinações de `windows` e `linux`, e `if: always()`
  # garante que ele roda (e falha) mesmo quando um deles falhou ou foi cancelado.
  portao-nativo:
    name: portão nativo
    if: always()
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Falhar se qualquer combinação Windows ou Linux não passou
        run: |
          if [ "${{ needs.windows.result }}" != "success" ]; then
            echo "::error::build/testes nativos falharam em pelo menos uma combinação Windows (resultado: ${{ needs.windows.result }})"
            exit 1
          fi
          if [ "${{ needs.linux.result }}" != "success" ]; then
            echo "::error::build/testes nativos falharam em pelo menos uma combinação Linux (resultado: ${{ needs.linux.result }})"
            exit 1
          fi
          echo "Todas as combinações Windows e Linux passaram"
