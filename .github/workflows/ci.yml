# Portão de qualidade do Agents-Hub.
#
# Por que existe, concretamente: em 2026-09-18 o commit de topo de `main` não
# compilava. Treze erros de TypeScript, seis arquivos de teste caindo na carga,
# e o gate pré-execução respondendo ao hook com uma Promise serializada como
# `{}` — ou seja, falhando ABERTO. Ficou assim porque nada, em nenhum momento,
# rodava `tsc -b` num checkout limpo.
#
# A regra que este arquivo institui é uma só: nenhuma mudança entra em `main`
# sem que uma máquina que não é a sua tenha compilado do zero e rodado a suíte
# inteira.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Um push novo no mesmo branch cancela a execução anterior: o que interessa é
# o veredito sobre o topo, não sobre um commit que já foi substituído.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ portão
  # Windows é a plataforma onde este projeto foi desenvolvido e validado contra
  # os binários reais dos agentes, e onde moram as partes que mais dependem do
  # sistema (junction em vez de symlink, `taskkill` para matar árvore de
  # processo). É por isso que ele é o job bloqueante.
  verificar:
    name: build + testes (Windows, Node ${{ matrix.node }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.5 é o piso declarado em `engines` — é onde `node:sqlite` ainda
        # exige `--experimental-sqlite`. 24 é o que se usa no dia a dia.
        # Testar os dois é o que impede o piso de virar ficção.
        node: ['22.5', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` e não `npm install`: instala exatamente o que está no
      # lockfile e falha se o lockfile divergir do `package.json`. Um build
      # reprodutível é metade do valor de um CI.
      - name: Instalar dependências
        run: npm ci

      # Checkout limpo, sem `dist/` nem `.tsbuildinfo` — que é exatamente a
      # condição em que o build quebrado passou despercebido na máquina de
      # quem o escreveu, onde o cache incremental do `tsc -b` escondia o erro.
      - name: Compilar (pacotes + Web UI)
        run: npm run build

      - name: Testes
        run: npm test

  # ------------------------------------------------------- informativo, ainda
  # O Hub nunca foi executado no Linux. Este job existe para descobrir o que
  # falta, não para bloquear quem trabalha — por isso `continue-on-error`.
  #
  # Ele deixa de ser informativo no dia em que passar de forma consistente:
  # aí `continue-on-error` sai daqui e o Linux vira plataforma suportada de
  # verdade. Marcar como suportado antes disso seria promessa sem lastro.
  explorar-linux:
    name: build + testes (Linux, informativo)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
