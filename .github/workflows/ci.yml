# Portão de qualidade do Agents-Hub.
#
# Por que existe, concretamente: em 2026-09-18 o commit de topo de `main` não
# compilava. Treze erros de TypeScript, seis arquivos de teste caindo na carga,
# e o gate pré-execução respondendo ao hook com uma Promise serializada como
# `{}` — ou seja, falhando ABERTO. Ficou assim porque nada, em nenhum momento,
# rodava `tsc -b` num checkout limpo.
#
# A regra que este arquivo institui é uma só: nenhuma mudança entra em `main`
# sem que uma máquina que não é a sua tenha compilado do zero e rodado a suíte
# inteira — nas DUAS versões de Node que o projeto declara suportar. A segunda
# parte importa tanto quanto a primeira: em 2026-09-18 esta suíte ficou verde
# no Node 24 (usado no dia a dia) e vermelha no Node 22.5 (o piso declarado em
# `engines`) por um bug real do `node:sqlite` — `.get()` sem nenhuma linha
# casando devolvia uma linha fantasma em vez de `undefined`, só corrigido em
# versão posterior do runtime. Testar um único Node teria deixado o piso virar
# ficção, exatamente o erro que este comentário já advertia antes de acontecer.
#
# ATENÇÃO: um job vermelho aqui só protege `main` se a branch tiver proteção
# exigindo o check `portão de qualidade` antes de aceitar merge. O workflow
# sozinho não bloqueia nada — quem clona este repositório e configura
# `Settings > Branches > Branch protection rules` é quem liga a trava.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Um push novo no mesmo branch cancela a execução anterior: o que interessa é
# o veredito sobre o topo, não sobre um commit que já foi substituído.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ portão
  # Windows é a plataforma onde este projeto foi desenvolvido e validado contra
  # os binários reais dos agentes, e onde moram as partes que mais dependem do
  # sistema (junction em vez de symlink, `taskkill` para matar árvore de
  # processo, quoting de linha de comando do `cmd.exe`). É por isso que é aqui
  # que as duas versões de Node declaradas rodam (o Linux, abaixo, roda só a
  # 24), em paralelo,
  # sem `fail-fast`: uma quebrar não deve esconder o resultado da outra.
  verificar:
    name: build + testes (Windows, Node ${{ matrix.node }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.5 é o piso declarado em `engines` — é onde `node:sqlite` ainda
        # exige `--experimental-sqlite` e onde bugs da API experimental (como
        # o de `.get()` acima) aparecem primeiro. 24 é o que se usa no dia a
        # dia. Testar os dois é o que impede o piso de virar ficção.
        node: ['22.5', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` e não `npm install`: instala exatamente o que está no
      # lockfile e falha se o lockfile divergir do `package.json`. Um build
      # reprodutível é metade do valor de um CI.
      - name: Instalar dependências
        run: npm ci

      # Separado de "compilar a Web UI": um erro de tipo num pacote do
      # backend e um erro do `vite build` no frontend são causas diferentes,
      # e um checkout limpo (sem `dist/` nem `.tsbuildinfo`) é exatamente a
      # condição em que o build quebrado passou despercebido na máquina de
      # quem o escreveu, onde o cache incremental do `tsc -b` escondia o erro.
      - name: Compilar pacotes (typecheck real, checkout limpo)
        run: npm run build:packages

      - name: Compilar Web UI
        run: npm run build --workspace @agents-hub/web

      # Depois do build, não antes: os testes importam `dist/*.test.js`
      # compilado, não os fontes — rodar isolado do passo de build garante que
      # o veredito de "testes" nunca mascara um build que já tinha falhado.
      - name: Testes
        run: npm test

      # `npm ci`, `build` e `test` não deveriam sujar nada que o git rastreia
      # — se sujaram, ou um artefato deixou de estar no `.gitignore`, ou um
      # script está escrevendo onde não devia. Barato de checar, caro de
      # descobrir manualmente depois.
      - name: Checkout continua limpo depois do build e dos testes
        shell: bash
        run: |
          sujeira="$(git status --porcelain)"
          if [ -n "$sujeira" ]; then
            echo "::error::build/test alterou arquivos rastreados pelo git — artefato sem .gitignore ou script escrevendo fora de dist/"
            echo "$sujeira"
            exit 1
          fi

  # ------------------------------------------------------------ portão Linux
  # Até 2026-09-28 este job era informativo (`continue-on-error`): o Hub nunca
  # tinha rodado no Linux e ninguém sabia o que faltava. A primeira execução
  # completa (container node:24-bookworm) achou três bugs REAIS, não de teste:
  # `killProcessTree` matava só a raiz (neto `detached` sobrevivia),
  # `imagemDoProcesso` nunca reconhecia um órfão (a reconciliação não matava
  # nada fora do Windows) e um consumidor travado com o stdout pausado deixava
  # a run pendurada para sempre. Corrigidos, a suíte passa inteira — e a partir
  # daí um job que não bloqueia só serve para acumular regressão em silêncio.
  # Por isso agora ele entra em `needs` do portão como qualquer outro.
  verificar-linux:
    name: build + testes (Linux, Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Compilar pacotes e Web UI
        run: npm run build
      - name: Testes
        run: npm test

      # R08-12: o smoke do MCP fala JSON-RPC de verdade com `packages/mcp`, que
      # por sua vez fala HTTP com um daemon — o único teste que atravessa as
      # três peças como um agente hospedeiro (Claude Code, Codex, Cursor) faz.
      # Roda contra um daemon ISOLADO: HOME próprio em `runner.temp` e porta
      # 4799, nunca a 4747 do dia a dia. Só leitura (sem `--delegate`): nenhuma
      # chamada a modelo, custo zero.
      - name: Smoke do MCP contra daemon isolado
        env:
          AGENTS_HUB_HOME: ${{ runner.temp }}/hub-home
          AGENTS_HUB_PORT: '4799'
          AGENTS_HUB_URL: http://127.0.0.1:4799
        run: |
          log="$RUNNER_TEMP/daemon.log"
          node --experimental-sqlite packages/daemon/dist/main.js > "$log" 2>&1 &
          daemon_pid=$!
          # Encerra só o daemon que este passo criou, pelo PID, aconteça o que
          # acontecer com o smoke.
          trap 'kill "$daemon_pid" 2>/dev/null || true' EXIT
          falhar() { echo "::error::$1"; cat "$log"; exit 1; }

          for _ in $(seq 1 60); do
            curl -fsS "$AGENTS_HUB_URL/health" > "$RUNNER_TEMP/health.json" 2>/dev/null && break
            kill -0 "$daemon_pid" 2>/dev/null || falhar "o daemon morreu na subida"
            sleep 1
          done
          [ -s "$RUNNER_TEMP/health.json" ] || falhar "o daemon não respondeu /health em 60s"
          # Prova de isolamento: o daemon que respondeu é o que usa o HOME
          # temporário, não um que já estivesse de pé na máquina.
          home_daemon="$(node -p 'require(process.argv[1]).home' "$RUNNER_TEMP/health.json")"
          [ "$home_daemon" = "$AGENTS_HUB_HOME" ] \
            || falhar "o daemon em $AGENTS_HUB_URL usa home '$home_daemon', não o isolado"

          python3 scripts/mcp-smoke.py || falhar "smoke do MCP falhou"

      - name: Checkout continua limpo depois do build, dos testes e do smoke
        run: |
          sujeira="$(git status --porcelain)"
          if [ -n "$sujeira" ]; then
            echo "::error::build/test/smoke alterou arquivos rastreados pelo git"
            echo "$sujeira"
            exit 1
          fi

  # ------------------------------------------------------------ informativo
  # Dependência transitiva com CVE conhecido é dívida que se acumula em
  # silêncio se ninguém olhar. Não bloqueia: subir a severidade para
  # bloqueante exige decidir uma política (que CVE aceita esperar, qual não)
  # que este workflow não tem autoridade para decidir sozinho — mas reportar
  # a cada push é o que impede a dívida de ficar invisível.
  auditoria-dependencias:
    name: auditoria de dependências (informativo)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev

  # ------------------------------------------------------------ o único gate
  # Branch protection no GitHub exige checks pelo NOME — e o nome de cada
  # combinação da matriz de `verificar` muda se alguém adicionar ou remover
  # uma versão de Node (`build + testes (Windows, Node 23)`, por exemplo).
  # Exigir cada combinação por nome quebraria silenciosamente toda vez que a
  # matriz mudasse, deixando novas combinações sem proteção até alguém
  # lembrar de reconfigurar `Settings > Branches`.
  #
  # Este job resolve isso: é o ÚNICO check que a proteção de branch precisa
  # exigir. Ele espera a matriz inteira do Windows (`needs: verificar`, que no
  # GitHub Actions significa TODAS as combinações, não uma) e o job Linux, e
  # falha se qualquer um falhou — só `auditoria-dependencias` fica de fora de
  # propósito, porque é informativo, não bloqueante.
  portao-de-qualidade:
    name: portão de qualidade
    if: always()
    needs: [verificar, verificar-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Falhar se Windows (qualquer Node) ou Linux falhou
        run: |
          if [ "${{ needs.verificar.result }}" != "success" ]; then
            echo "::error::build+testes falhou em pelo menos uma combinação de Node no Windows — ver o job 'verificar' acima"
            exit 1
          fi
          if [ "${{ needs.verificar-linux.result }}" != "success" ]; then
            echo "::error::build+testes ou smoke do MCP falhou no Linux — ver o job 'verificar-linux' acima"
            exit 1
          fi
          echo "Windows (todas as combinações de Node) e Linux passaram"
