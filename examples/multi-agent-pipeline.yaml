name: Pipeline de Refatoração e Testes Multi-Agente
# Os quatro passos formam uma CADEIA (cada um depende do anterior): 4 lotes de
# 1 passo, nada roda em paralelo. Passos sem dependência entre si cairiam no
# mesmo lote e rodariam juntos (`hub workflow validate` mostra os lotes).
description: Orquestra Claude, Codex e OpenCode em uma cadeia de passos sequenciais

version: "1.0"

steps:
  - id: plan
    agent: claude
    objective: Analisar a arquitetura atual e mapear os módulos que precisam de refatoração
    isolation: worktree
    supervision: semi
    acceptanceCriteria:
      - Produzir plano detalhado de refatoração

  - id: backend_refactor
    agent: codex
    objective: Refatorar lógica de backend conforme o plano
    dependsOn:
      - plan
    isolation: worktree
    supervision: semi
    budget:
      usd: 1.0

  - id: test_suite
    agent: opencode
    objective: Escrever suíte de testes unitários para a nova lógica
    dependsOn:
      - backend_refactor
    isolation: worktree
    supervision: semi

  - id: final_review
    agent: claude
    objective: Revisar código final e garantir integridade de todo o pipeline
    dependsOn:
      - test_suite
    isolation: worktree
    supervision: semi
